# 내 컴퓨터에서 써 보기용 MySQL 8.0 (README "내 컴퓨터에서 바로 써 보기").
# 처음 뜰 때만 스키마 → ShedLock 테이블 → 테스트 계정 순서로 넣는다. 다시 넣으려면 docker compose down -v.
services:
  db:
    image: mysql:8.0
    container_name: mainblog-local-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mainblog
      TZ: Asia/Seoul   # 앱이 한국 시간으로 저장하므로 DB의 NOW()도 맞춘다
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - ../docs/04-design/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ../docs/04-design/shedlock.sql:/docker-entrypoint-initdb.d/2-shedlock.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/3-seed.sql:ro
      - mainblog-local-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]   # TCP로 확인해야 초기화용 임시 서버가 아닌 실제 서버를 기다린다
      interval: 3s
      retries: 40
  # 테스트 메일함: 앱이 보낸 메일(가입 인증번호 등)을 실제로 보내지 않고 http://localhost:8025 에서 보여 준다
  mail:
    image: axllent/mailpit:v1.21.8
    container_name: mainblog-local-mail
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # 메일함 화면
volumes:
  mainblog-local-data:
