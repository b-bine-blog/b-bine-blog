<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 찾기 - 블바인 블로그</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <main>
    <h1>비밀번호 찾기</h1>
    <form id="reset-form" novalidate>
      <!-- 이메일 찾기에서 온 경우(resetToken)에는 이메일 칸 없이 시작한다(FR-037, FR-038) -->
      <div id="email-box">
        <label for="email">가입한 이메일</label>
        <input type="email" id="email" autocomplete="username" maxlength="255" required>
        <button type="button" id="send-code">인증번호 받기</button>
      </div>
      <p class="message" id="email-message"></p>

      <div id="code-box" hidden>
        <label for="code">인증번호 6자리</label>
        <input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button type="button" id="verify-code">확인</button>
        <button type="button" id="resend-code">다시 보내기</button>
        <p class="hint">인증번호는 30분 동안 쓸 수 있습니다.</p>
      </div>

      <div id="password-box" hidden>
        <label for="new-password">새 비밀번호</label>
        <input type="password" id="new-password" autocomplete="new-password" maxlength="15">
        <label for="new-password-confirm">새 비밀번호 확인</label>
        <input type="password" id="new-password-confirm" autocomplete="new-password" maxlength="15">
        <p class="hint">8~15자, 영문·숫자·특수문자를 모두 넣어 주세요.</p>
        <button type="submit" id="submit">비밀번호 바꾸기</button>
      </div>
      <p class="message" id="message"></p>
    </form>
    <p><a href="/login.html">로그인</a> · <a href="/find-email.html">이메일 찾기</a></p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/find-password.js"></script>
</body>
</html>
