<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/img/favicon.ico?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시스템 문의 - b-bine blog</title>
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <!-- 시스템 문의 (ADM-08, D-112). 회원은 계정으로, 비회원은 이메일과 사람 확인으로 보낸다. 값은 textContent로만 넣는다(D-64). -->
  <main>
    <h1>시스템 문의</h1>
    <p class="hint">사이트 이용 중 불편한 점이나 오류를 관리자에게 알려 주세요. 블로그 안의 문제는 그 블로그의 신고 기능을 써 주세요.</p>
    <form id="inquiry-form" novalidate>
      <label for="title">제목</label>
      <input type="text" id="title" maxlength="30" required>
      <label for="content">내용</label>
      <textarea id="content" rows="8" maxlength="2000" required></textarea>
      <p class="hint" id="content-count">0 / 2000</p>
      <div id="guest-fields" hidden>
        <label for="email">답변 받을 이메일</label>
        <input type="email" id="email" maxlength="255" autocomplete="email">
        <p class="hint">답변은 이 이메일로 보내 드립니다. 로그인하면 알림으로 받을 수 있어요.</p>
        <div id="captcha"></div>
      </div>
      <p class="hint" id="member-hint" hidden>답변이 달리면 알림으로 알려 드립니다.</p>
      <button type="submit" id="submit">보내기</button>
      <p class="message" id="message" role="status"></p>
    </form>

    <section id="mine" hidden>
      <h2>내 문의</h2>
      <ul class="inquiry-list" id="mine-list"></ul>
      <div class="pagination" id="mine-pager"></div>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/inquiry.js"></script>
</body>
</html>
