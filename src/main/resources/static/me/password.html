<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 바꾸기 - b-bine blog</title>
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main>
    <h1 id="title">비밀번호 바꾸기</h1>
    <form id="password-form" novalidate>
      <!-- 소셜로만 가입해 비밀번호가 없으면 숨기고 새로 만든다(008 FR-009, D-125) -->
      <div id="current-box">
        <label for="current-password">현재 비밀번호</label>
        <input type="password" id="current-password" autocomplete="current-password" maxlength="100">
      </div>
      <label for="new-password">새 비밀번호</label>
      <input type="password" id="new-password" autocomplete="new-password" maxlength="15">
      <label for="new-password-confirm">새 비밀번호 확인</label>
      <input type="password" id="new-password-confirm" autocomplete="new-password" maxlength="15">
      <p class="hint">8~15자, 영문·숫자·특수문자를 모두 넣어 주세요. 바꾸면 다른 기기에서는 로그아웃됩니다.</p>
      <button type="submit" id="submit">바꾸기</button>
      <p class="message" id="message"></p>
    </form>
    <p><a href="/me/index.html">내 정보로 돌아가기</a></p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/me-password.js"></script>
</body>
</html>
