<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/img/favicon.ico?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원탈퇴 - b-bine blog</title>
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main>
    <h1>회원탈퇴</h1>
    <!-- 블로그장인 블로그가 있으면 탈퇴할 수 없다(FR-046) -->
    <section id="blocked" hidden>
      <p>블로그장으로 운영 중인 블로그가 있습니다. 위임하거나 폐쇄한 뒤 탈퇴할 수 있습니다.</p>
      <ul id="owned-blogs"></ul>
    </section>
    <section id="form-box" hidden>
      <p>탈퇴하면 30일 뒤 개인정보가 삭제됩니다. 같은 이메일로 다시 가입할 수 있지만 예전 글과는 연결되지 않습니다.</p>
      <!-- 소셜로만 가입해 비밀번호가 없으면 숨긴다(008 FR-009, D-125) -->
      <div id="password-box">
        <label for="password">비밀번호 확인</label>
        <input type="password" id="password" autocomplete="current-password" maxlength="100">
      </div>
      <button type="button" id="withdraw">탈퇴하기</button>
    </section>
    <p class="message message--error" id="message"></p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/withdraw.js"></script>
</body>
</html>
