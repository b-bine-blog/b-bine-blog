<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>소셜 로그인 마무리 - b-bine blog</title>
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <!-- 소셜 로그인 마무리 (008 FR-003~FR-007, D-125). 대기 토큰은 주소 #t=로 받아 바로 지운다 -->
  <main>
    <h1 id="title">소셜 로그인</h1>
    <p class="message" id="loading">확인하고 있습니다…</p>

    <!-- 소셜이 확인한 이메일이 없을 때: 이메일을 적고 6자리 인증번호로 확인(FR-004) -->
    <section id="step-email" hidden>
      <p>이 소셜 계정에서 확인된 이메일을 받지 못했습니다. 쓰실 이메일을 인증해 주세요.</p>
      <!-- 서비스 이름은 social.js가 채운다(2026-10-13 사용자 요청) -->
      <p class="hint" id="email-hint"></p>
      <label for="email">이메일</label>
      <input type="email" id="email" autocomplete="email" maxlength="255">
      <button type="button" id="send-code">인증번호 받기</button>
      <div id="code-box" hidden>
        <label for="code">인증번호 6자리</label>
        <input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button type="button" id="verify-code">확인</button>
        <button type="button" id="resend-code" class="button-light">다시 보내기</button>
      </div>
      <p class="message" id="email-message"></p>
    </section>

    <!-- 새 회원: 이름·닉네임·전화번호와 동의(FR-005). 비밀번호는 받지 않는다 -->
    <section id="step-signup" hidden>
      <p>가입을 마치려면 회원 정보를 적어 주세요. <span id="signup-email"></span></p>
      <label for="name">이름</label>
      <input type="text" id="name" maxlength="20" autocomplete="name">
      <label for="nickname">닉네임</label>
      <input type="text" id="nickname" maxlength="12">
      <button type="button" id="check-nickname" class="button-light button-small">중복 확인</button>
      <p class="message" id="nickname-message"></p>
      <label for="phone">전화번호</label>
      <input type="tel" id="phone" maxlength="13" autocomplete="tel" placeholder="010-1234-5678">
      <label><input type="checkbox" id="agree-terms"> [필수] 이용약관 동의</label>
      <label><input type="checkbox" id="agree-privacy"> [필수] 개인정보 수집·이용 동의</label>
      <button type="button" id="submit-signup">가입하기</button>
      <p class="message" id="signup-message"></p>
    </section>

    <!-- 같은 이메일로 가입한 회원: 비밀번호를 확인한 뒤 연결(FR-006, FR-007) -->
    <section id="step-link" hidden>
      <p><strong id="link-email"></strong>(으)로 가입한 계정이 있습니다. 비밀번호를 확인하면 이 소셜 계정을 연결하고 로그인합니다.</p>
      <label for="password">비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" maxlength="100">
      <div id="captcha" hidden></div>
      <button type="button" id="submit-link">연결하고 로그인</button>
      <p class="message" id="link-message"></p>
      <p><a href="/find-password.html">비밀번호 찾기</a></p>
    </section>

    <p class="message message--error" id="message"></p>
    <p><a href="/login.html">로그인 화면으로</a></p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/social-buttons.js"></script>
  <script src="/js/social.js"></script>
</body>
</html>
