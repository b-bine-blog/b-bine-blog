<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>b-bine blog</title>
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <!-- 메인 화면: 위 검색 띠, 블로그 둘러보기(카드 5개), 아래 글 피드 -->
  <section class="hero">
    <div class="hero__inner hero__inner--split">
      <div class="hero__main">
      <!-- 제목·안내 문구 대신 최신 공지·인기 블로그·인기 글을 번갈아 보여 준다(D-116). 제목은 화면 읽기용으로만 둔다 -->
      <h1 class="sr-only">함께 쓰는 블로그</h1>
      <div id="hero-spotlight" class="spotlight" aria-live="polite" hidden></div>
      <form id="search-form" class="blog-search" role="search">
        <label for="q" class="sr-only">통합 검색</label>
        <input id="q" name="q" type="search" maxlength="20" placeholder="블로그·글 제목·태그·닉네임 검색">
        <button type="submit">검색</button>
      </form>
      </div>
      <!-- 오른쪽 빈 곳: 로그인했고 운영·참여하는 블로그가 있으면 보여 준다. 없으면 비워 둔다(2026-10-13 사용자 요청) -->
      <aside id="hero-my-blogs" class="hero-mine" aria-label="내 블로그" hidden></aside>
    </div>
  </section>
  <main class="home">
    <!-- 블로그 둘러보기 (2026-10-13): 글 위에 두고, 블로그마다 표지 카드로 5개 보여 준다 -->
    <section class="panel blog-showcase">
      <div class="panel__head">
        <h2>블로그 둘러보기</h2>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-sort="latest">최신</button>
        <button type="button" role="tab" data-sort="popular">인기</button>
      </div>
      <p id="result-title" class="blog-list__meta"></p>
      <p id="message" class="message" role="alert"></p>
      <ul id="blogs" class="blog-list blog-grid" data-size="5"></ul>
    </section>
    <!-- 메인 피드 (004 T031, FR-061~FR-064, D-100 #18) -->
    <section id="feed" class="panel">
      <div class="panel__head">
        <h2>글</h2>
        <!-- 목록·페이징: 한 페이지 10·20·30개 중 고름(BRD-02). 최신·인기 탭에만 보인다 -->
        <label class="inline inline--bare" id="feed-size-box" aria-label="한 페이지 글 수">
          <select id="feed-size">
            <option value="10">10개</option>
            <option value="20">20개</option>
            <option value="30">30개</option>
          </select>
        </label>
      </div>
      <div class="tabs" role="tablist" id="feed-tabs">
        <button type="button" role="tab" data-feed="LATEST">최신</button>
        <button type="button" role="tab" data-feed="POPULAR">인기</button>
        <!-- 관심(D-137): 좋아요를 누른 구독 블로그 > 구독 > 팔로우 > 그 밖의 인기 글. 로그인한 회원만 -->
        <button type="button" role="tab" data-feed="INTEREST" data-login hidden>관심</button>
        <button type="button" role="tab" data-feed="SUBSCRIBED" data-login hidden>구독</button>
        <button type="button" role="tab" data-feed="FOLLOWING" data-login hidden>팔로우</button>
        <span id="feed-tag-tabs" class="feed-tag-tabs"></span>
        <button type="button" id="feed-tag-add" class="tab-add" data-login hidden aria-label="태그 탭 추가" title="태그 탭 추가"><svg class="tab-add__icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
      </div>
      <form id="feed-tag-form" class="feed-tag-form row" hidden>
        <label class="sr-only" for="feed-tag-input">추가할 태그</label>
        <input type="text" id="feed-tag-input" maxlength="21" placeholder="태그 이름 (예: 여행)" autocomplete="off">
        <button type="submit">추가</button>
        <button type="button" id="feed-tag-cancel" class="button-quiet">취소</button>
      </form>
      <p id="feed-message" class="message" role="alert"></p>
      <ul id="feed-list" class="post-list"></ul>
      <nav id="feed-pages" class="pagination" aria-label="글 페이지"></nav>
      <button type="button" id="feed-more" class="feed-more" hidden>더 보기</button>
    </section>

  </main>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/blog-list.js"></script>
  <script src="/js/board-common.js"></script>
  <script src="/js/board-feed.js"></script>
  <script src="/js/hero-spotlight.js"></script>
  <script src="/js/hero-my-blogs.js"></script>
</body>
</html>
