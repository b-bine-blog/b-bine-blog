<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/img/favicon.ico?v=2" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--OG-->
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main class="wide reading">
    <p class="hint"><a href="/notices">공지사항</a></p>
    <article id="post" hidden>
      <h1 class="post-title" id="title"></h1>
      <p class="hint" id="meta"></p>
      <div class="post-content" id="content"></div>
      <ul class="chips" id="tags"></ul>
      <div class="row">
        <button type="button" id="like" hidden>좋아요 <span id="like-count">0</span></button>
        <span class="hint" id="like-static" hidden></span>
        <button type="button" id="share" class="button-outline" hidden>링크 복사</button>
        <a id="edit" class="button button-outline" hidden>수정</a>
        <button type="button" id="delete" class="button-quiet" hidden>삭제</button>
      </div>
      <input type="text" id="share-url" class="sr-only" readonly tabindex="-1" aria-hidden="true">
      <p class="message" id="post-message" role="alert"></p>
    </article>

    <section id="comments" hidden>
      <h2>댓글 <span id="comment-count"></span></h2>
      <form id="comment-form" hidden>
        <label for="comment-content" class="sr-only">댓글</label>
        <textarea id="comment-content" maxlength="500" rows="3" placeholder="댓글을 남겨 주세요"></textarea>
        <div class="counter"><span id="comment-length">0</span>/500</div>
        <button type="submit">댓글 쓰기</button>
      </form>
      <p class="hint" id="comment-login" hidden><a href="/login.html">로그인</a>하면 댓글을 쓸 수 있습니다.</p>
      <ul class="comment-list" id="comment-list"></ul>
      <nav class="pagination" id="comment-pages" aria-label="댓글 페이지"></nav>
    </section>
    <p class="message message--error" id="message" role="alert"></p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/board-common.js"></script>
  <script src="/js/board-post.js"></script>
</body>
</html>
