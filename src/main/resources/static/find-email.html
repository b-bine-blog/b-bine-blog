<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이메일 찾기 - b-bine blog</title>
  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main>
    <h1>이메일 찾기</h1>
    <form id="find-form" novalidate>
      <label for="name">이름</label>
      <input type="text" id="name" maxlength="20" autocomplete="name">
      <label for="phone">휴대폰 번호</label>
      <input type="tel" id="phone" maxlength="13" inputmode="numeric" autocomplete="tel">
      <button type="submit" id="submit">찾기</button>
      <p class="message" id="message"></p>
    </form>
    <!-- 가린 이메일만 보여준다(FR-035, FR-036). 재설정은 임시 토큰으로 이어 간다(FR-038) -->
    <section id="result" hidden>
      <h2>가입한 계정</h2>
      <ul id="accounts"></ul>
      <p class="hint">[비밀번호 재설정]은 10분 안에 눌러 주세요.</p>
    </section>
    <p><a href="/login.html">로그인</a> · <a href="/find-password.html">비밀번호 찾기</a></p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/find-email.js"></script>
</body>
</html>
