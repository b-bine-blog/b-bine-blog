<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블로그 만들기 - 블바인 블로그</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <main>
    <h1>블로그 만들기</h1>
    <form id="create-form" novalidate>
      <label for="name">블로그 이름</label>
      <input type="text" id="name" maxlength="30" required>
      <p class="hint">1~30자. 다른 블로그와 같아도 됩니다.</p>

      <label for="address">블로그 주소</label>
      <div class="row"><span>/blog/</span><input type="text" id="address" maxlength="30" required class="grow"></div>
      <p class="hint">영문 소문자·숫자·- 3~30자. 만든 뒤에는 바꿀 수 없습니다.</p>

      <label for="description">소개 (선택)</label>
      <textarea id="description" maxlength="500" rows="3"></textarea>

      <label for="tag-input">태그 (최대 10개)</label>
      <input type="text" id="tag-input" maxlength="21" placeholder="입력하고 Enter">
      <ul class="chips" id="tags"></ul>
      <p class="hint">1~20자 한글·영문·숫자·_ (가운데 공백은 _로 바뀝니다)</p>

      <label for="visibility">공개 범위</label>
      <select id="visibility">
        <option value="PUBLIC">공개 — 누구나 보고 목록·검색에 나옵니다</option>
        <option value="LINK">일부 공개 — 공유 링크로 들어온 사람만</option>
        <option value="PRIVATE">비공개 — 멤버만</option>
      </select>
      <p class="hint">공개(일부 공개 포함)는 3개, 비공개는 5개까지 만들 수 있습니다.</p>

      <label for="join-policy">참여 방식</label>
      <select id="join-policy">
        <option value="APPROVAL">승인제 — 블로그장이 승인해야 참여</option>
        <option value="FREE">자유 참여 — 신청하면 바로 멤버</option>
      </select>

      <label for="cover">대표 이미지 (선택, 3MB 이하 jpg·jpeg·png·gif·webp)</label>
      <input type="file" id="cover" accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp">

      <button type="submit" id="submit">만들기</button>
      <p class="message message--error" id="message"></p>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/blog-tags.js"></script>
  <script src="/js/blog-new.js"></script>
</body>
</html>
