openapi: 3.0.3
info:
  title: 메인블로그 소셜 로그인 API (008-social-login)
  version: 0.1.0
  description: |
    구글·카카오·네이버 로그인과 가입·연결 마무리, 내 정보의 연결 관리. 근거는 specs/008-social-login/spec.md와 D-125.
    - 소셜 화면 이동은 API가 아니라 Spring Security가 맡는다.
      `GET /oauth2/authorization/{google|kakao|naver}?remember=1` → 소셜 로그인 화면 →
      `GET /login/oauth2/code/{id}` → 결과에 따라 `/`, `/social.html#t=대기토큰`, `/login.html?socialError=코드`로 이동.
      내 정보에서 연결할 때는 `?mode=link`를 붙이고 `/me/?social=linked` 또는 `/me/?socialError=코드`로 돌아온다.
    - 대기 토큰은 주소 조각(#t=)으로만 주고 본문으로만 받는다. 서버에는 해시만 둔다.
    - 상태를 바꾸는 요청은 `X-XSRF-TOKEN` 헤더가 있어야 한다(SEC-10).
    - 이메일은 가려서 준다(D-22).
servers:
  - url: /
components:
  schemas:
    PendingView:
      type: object
      properties:
        provider: { type: string, enum: [GOOGLE, KAKAO, NAVER] }
        step: { type: string, enum: [EMAIL, SIGNUP, LINK], description: EMAIL은 이메일 인증, SIGNUP은 회원 정보 입력, LINK는 비밀번호 확인 }
        maskedEmail: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
    SessionMember:
      type: object
      description: 로그인 회원 정보(001 계약의 GET /api/auth/session과 같음). AT·RT 쿠키도 함께 내려준다
paths:
  /api/social/providers:
    get:
      summary: 앱 키가 있는 소셜 서비스 목록(버튼을 그릴 것만)
      responses:
        '200':
          content:
            application/json:
              schema: { type: object, properties: { providers: { type: array, items: { type: string, enum: [google, kakao, naver] } } } }
  /api/social/pending:
    post:
      summary: 대기 상태 보기
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/PendingView' } } } }
        '410': { description: SOCIAL_PENDING_INVALID (없거나 만료) }
  /api/social/email-code:
    post:
      summary: 이메일 인증번호 보내기(소셜이 확인한 이메일이 없을 때)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, email], properties: { token: { type: string }, email: { type: string } } }
      responses:
        '204': { description: 보냄. 이미 가입된 이메일이어도 똑같이 보낸다(계정 존재를 알리지 않음) }
        '400': { description: VALIDATION_FAILED }
        '410': { description: SOCIAL_PENDING_INVALID }
        '429': { description: RATE_LIMITED }
  /api/social/email-verify:
    post:
      summary: 인증번호 확인. 가입된 이메일이면 LINK, 아니면 SIGNUP 단계로 바뀐다
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, email, code], properties: { token: { type: string }, email: { type: string }, code: { type: string } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/PendingView' } } } }
        '400': { description: CODE_MISMATCH(remainingAttempts), CODE_INVALID }
        '410': { description: SOCIAL_PENDING_INVALID }
  /api/social/signup:
    post:
      summary: 소셜로 가입 마무리(비밀번호 없음)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, nickname, phone, agreeTerms, agreePrivacy]
              properties:
                token: { type: string }
                name: { type: string }
                nickname: { type: string }
                phone: { type: string }
                agreeTerms: { type: boolean }
                agreePrivacy: { type: boolean }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/SessionMember' } } } }
        '400': { description: VALIDATION_FAILED }
        '409': { description: NICKNAME_DUPLICATE, SIGNUP_UNAVAILABLE, SOCIAL_ALREADY_LINKED }
        '410': { description: SOCIAL_PENDING_INVALID }
  /api/social/link:
    post:
      summary: 같은 이메일 회원의 비밀번호를 확인하고 연결·로그인
      description: 잠금·사람 확인 규칙은 이메일 로그인과 같다(SEC-03, SEC-13).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string }, captchaToken: { type: string } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/SessionMember' } } } }
        '400': { description: CAPTCHA_REQUIRED, CAPTCHA_FAILED }
        '401': { description: INVALID_CREDENTIALS(captchaRequired) }
        '409': { description: SOCIAL_ALREADY_LINKED }
        '410': { description: SOCIAL_PENDING_INVALID }
        '423': { description: LOCKED }
  /api/members/me/social:
    get:
      summary: 내 소셜 연결
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasPassword: { type: boolean, description: false면 소셜로만 가입한 회원 }
                  accounts: { type: array, items: { type: object, properties: { provider: { type: string }, connectedAt: { type: string, format: date-time } } } }
                  available: { type: array, items: { type: string }, description: 연결할 수 있는 서비스 }
        '401': { description: UNAUTHENTICATED }
  /api/members/me/social/{provider}:
    delete:
      summary: 연결 끊기
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, kakao, naver] } }
      responses:
        '204': { description: 끊음 }
        '404': { description: NOT_FOUND (연결 안 됨) }
        '409': { description: SOCIAL_LAST_LOGIN_METHOD (비밀번호도 다른 연결도 없음) }
