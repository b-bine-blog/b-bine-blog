# 서버의 ~/nginx/mainttblog.java21.net.conf 사본. 앱이 꺼져 있을 때(배포 중) 502/504 대신 점검 중 화면을 보여 준다.
server {
    listen 80;
    server_name mainttblog.java21.net;
    access_log /home/aiot3/AIGJ_01_008/nginx/logs/mainttblog.java21.net.access.log;
    error_log  /home/aiot3/AIGJ_01_008/nginx/logs/mainttblog.java21.net.error.log;
    client_max_body_size 20M;

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /home/aiot3/AIGJ_01_008/nginx/maintenance;
        add_header Cache-Control "no-store" always;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:8370;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
