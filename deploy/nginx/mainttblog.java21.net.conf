# 서버 ~/nginx/mainttblog.java21.net.conf 사본(2026-10-14 서버 파일 기준). https(443)·인증서 줄은 Certbot이 관리한다.
# 서버 파일을 이 사본으로 통째로 덮어쓰지 않는다. Certbot 줄이 빠지면 https가 꺼진다(2026-10-14 사고).
# 롤링 배포(D-129): 앱은 늘 8370과 8371 두 개가 떠 있고, nginx는 꺼진 쪽을 건너뛴다.
upstream mainttblog_app {
    server 127.0.0.1:8370 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8371 max_fails=1 fail_timeout=5s;
}

server {
    server_name mainttblog.java21.net;

    access_log /home/aiot3/AIGJ_01_008/nginx/logs/mainttblog.java21.net.access.log;
    error_log  /home/aiot3/AIGJ_01_008/nginx/logs/mainttblog.java21.net.error.log;

    client_max_body_size 20M;

    location / {
        proxy_pass http://mainttblog_app;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 사용 시 필요
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mainttblog.java21.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mainttblog.java21.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mainttblog.java21.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name mainttblog.java21.net;
    return 404; # managed by Certbot


}
