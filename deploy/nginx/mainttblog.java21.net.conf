# 서버의 ~/nginx/mainttblog.java21.net.conf 사본. 앱이 꺼져 있을 때 502/504 대신 점검 중 화면을 보여 준다.
# 무중단 배포(D-126): 앱은 8370과 8371 중 하나(배포 중에는 둘 다)에 떠 있다.
# 꺼진 포트로 간 요청은 바로 다른 포트로 넘기므로 배포할 때마다 nginx를 reload하지 않아도 된다.
upstream mainttblog_app {
    server 127.0.0.1:8370 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8371 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name mainttblog.java21.net;
    access_log /home/aiot3/AIGJ_01_008/nginx/logs/mainttblog.java21.net.access.log;
    error_log  /home/aiot3/AIGJ_01_008/nginx/logs/mainttblog.java21.net.error.log;
    client_max_body_size 20M;

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /home/aiot3/AIGJ_01_008/nginx/maintenance;
        add_header Cache-Control "no-store" always;
        internal;
    }

    location / {
        proxy_pass http://mainttblog_app;
        # 연결이 안 되거나 내려가는 중(502/503)이면 다른 포트로 다시 보낸다
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
