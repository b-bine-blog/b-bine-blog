<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>잠시 점검 중 - b-bine blog</title>
<style>
  :root { --green-800:#145a37; --green-600:#218a56; --green-500:#2fa86b; --bg:#f5f9f6; --text:#1d2a23; --muted:#5f6f66; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { background:var(--green-800); border-bottom:3px solid var(--green-500); padding:14px 16px; }
  header span { display:block; max-width:1120px; margin:0 auto; color:#fff; font-weight:800; font-size:1.3rem; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .box { max-width:460px; width:100%; background:#fff; border-radius:12px; padding:32px 24px; text-align:center;
         box-shadow:0 1px 3px rgba(15,61,38,.08), 0 4px 14px rgba(15,61,38,.05); }
  h1 { margin:0 0 10px; font-size:1.5rem; color:var(--green-800); }
  p { margin:0 0 8px; color:var(--muted); line-height:1.6; }
  .dot { display:inline-block; width:10px; height:10px; margin:14px 4px 0; border-radius:50%; background:var(--green-500); animation:b 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay:.2s; } .dot:nth-child(3) { animation-delay:.4s; }
  @keyframes b { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }
</style>
</head>
<body>
<header><span>b-bine blog</span></header>
<main>
  <div class="box">
    <h1>잠시 점검 중입니다</h1>
    <p>새 기능을 적용하고 있어요. 보통 1분 안에 끝납니다.</p>
    <p>이 화면은 10초마다 자동으로 다시 열립니다.</p>
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
</main>
</body>
</html>
