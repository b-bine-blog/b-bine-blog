# jar를 만들어 서버에 배포한다 (D-106, 도커 없이).
# main에 push되면 실행된다. "Run workflow" 버튼은 이 파일이 main에 들어간 뒤에 보인다.
name: deploy

on:
  push:
    branches: [main, deploy-docker]   # deploy-docker: main 병합 전 PR 브랜치에서 배포 확인용
    paths-ignore: ['release-notes/**']   # 노트만 더한 push는 배포하지 않고 release-note가 공지로 올린다(D-108)
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: jar 만들기
        # 테스트는 Testcontainers(도커)가 필요해 배포에서는 돌리지 않는다
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bootJar -x test
          cp build/libs/*-SNAPSHOT.jar app.jar.new

      - name: 서버로 jar와 스크립트, 테스트 블로그 표지 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: app.jar.new,deploy/deploy.sh,deploy/seed-covers
          target: ~/blogproject
          overwrite: true

      - name: 서버에서 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CODE_HASH_SECRET: ${{ secrets.CODE_HASH_SECRET }}
          BLACKLIST_HASH_SECRET: ${{ secrets.BLACKLIST_HASH_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: APP_PORT,APP_BASE_URL,DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,JWT_SECRET,CODE_HASH_SECRET,BLACKLIST_HASH_SECRET,MAIL_USERNAME,MAIL_PASSWORD,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY
          script: bash ~/blogproject/deploy/deploy.sh
